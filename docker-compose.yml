services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/models:/app/models
      - ./backend/uploads:/app/uploads
      - ./backend/results:/app/results
    environment:
      - ENVIRONMENT=production
      - DEVICE=cpu

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
